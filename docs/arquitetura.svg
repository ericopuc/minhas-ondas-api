<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5cc8ff"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#050d1a"/>
  <text x="40" y="52" fill="#ffffff" font-size="26" font-weight="700">Minhas Ondas — Arquitetura</text>

  <!-- Usuário -->
  <circle cx="420" cy="120" r="46" fill="#0a1628" stroke="#5cc8ff" stroke-width="2"/>
  <text x="420" y="126" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Usuário</text>

  <line x1="420" y1="166" x2="420" y2="226" stroke="#5cc8ff" stroke-width="2" marker-end="url(#seta)"/>
  <text x="432" y="202" fill="#a7bad4" font-size="13">Interage</text>

  <!-- Container da interface -->
  <rect x="220" y="230" width="400" height="130" rx="14" fill="#11233f" stroke="#3d5f8e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="420" y="254" text-anchor="middle" fill="#a7bad4" font-size="13">Docker: nginx · porta 8080</text>
  <rect x="270" y="270" width="300" height="70" rx="10" fill="#1d5fa8" stroke="#5cc8ff" stroke-width="1.5"/>
  <text x="420" y="311" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Interface (Nuxt)</text>

  <!-- Interface <-> API -->
  <line x1="420" y1="364" x2="420" y2="426" stroke="#5cc8ff" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="432" y="392" fill="#a7bad4" font-size="13">REST · JSON</text>
  <text x="432" y="410" fill="#7890b3" font-size="12">GET · POST · PUT · DELETE</text>

  <!-- Container da API -->
  <rect x="220" y="430" width="400" height="130" rx="14" fill="#11233f" stroke="#3d5f8e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="420" y="454" text-anchor="middle" fill="#a7bad4" font-size="13">Docker: Python 3.12 · porta 5000</text>
  <rect x="270" y="470" width="300" height="70" rx="10" fill="#0f7a5f" stroke="#3fd0a0" stroke-width="1.5"/>
  <text x="420" y="511" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">API (Flask)</text>

  <!-- API <-> API externa -->
  <line x1="624" y1="505" x2="746" y2="505" stroke="#5cc8ff" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="685" y="494" text-anchor="middle" fill="#a7bad4" font-size="13">REST · GET</text>

  <!-- API externa -->
  <rect x="750" y="430" width="310" height="150" rx="14" fill="#1a1f2b" stroke="#3d5f8e" stroke-width="2"/>
  <text x="905" y="454" text-anchor="middle" fill="#a7bad4" font-size="13">Internet · API externa</text>
  <rect x="780" y="470" width="250" height="90" rx="10" fill="#c65a12" stroke="#f08a3c" stroke-width="1.5"/>
  <text x="905" y="500" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Open-Meteo</text>
  <text x="905" y="522" text-anchor="middle" fill="#ffe6d2" font-size="13">Marine API (ondas, maré)</text>
  <text x="905" y="542" text-anchor="middle" fill="#ffe6d2" font-size="13">Forecast API (vento)</text>

  <!-- API <-> SQLite -->
  <line x1="420" y1="564" x2="420" y2="626" stroke="#5cc8ff" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="432" y="600" fill="#a7bad4" font-size="13">Leitura / escrita (SQLAlchemy)</text>

  <!-- Volume + SQLite -->
  <rect x="300" y="630" width="240" height="140" rx="14" fill="#11233f" stroke="#3d5f8e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="420" y="654" text-anchor="middle" fill="#a7bad4" font-size="13">Volume persistente</text>
  <path d="M345 684 a75 13 0 0 0 150 0 v50 a75 13 0 0 1 -150 0 Z" fill="#d99a00" stroke="#f5c542" stroke-width="1.5"/>
  <ellipse cx="420" cy="684" rx="75" ry="13" fill="#f0b400" stroke="#f5c542" stroke-width="1.5"/>
  <text x="420" y="722" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">SQLite</text>
</svg>
